name: Build VoiceForge portable for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download project source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build portable EXE
        run: npm run dist
      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: VoiceForge-0.1.1-Portable-Windows
          path: release-portable/*.exe
          if-no-files-found: error
          retention-days: 14
